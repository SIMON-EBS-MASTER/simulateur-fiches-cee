<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur CEE — EBS Énergie</title>
<style>
  :root{
    --navy:#1B3A5C; --navy-dk:#12283F; --navy-lt:#2E6096;
    --green:#1E6B3A; --green-bg:#E9F4EC;
    --blue:#1A4A7A; --blue-bg:#EAF1F9;
    --orange:#D97706; --orange-bg:#FFF3CD;
    --bg:#F5F7FA; --panel:#FFFFFF; --border:#DDE3EA; --border-dk:#C4CDD8;
    --text:#1A2530; --text-2:#5B6B7B; --text-3:#8A97A5;
    --red:#B3261E; --red-bg:#FBEAEA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px}

  /* ── Header ── */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--navy-lt));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
  .brand-text h1{font-size:17px;font-weight:600;margin:0;color:var(--navy-dk)}
  .brand-text p{font-size:12px;color:var(--text-3);margin:1px 0 0}
  .stat-pill{font-size:12px;color:var(--text-2);background:var(--panel);border:1px solid var(--border);
    padding:6px 12px;border-radius:20px;font-variant-numeric:tabular-nums}

  /* ── Search ── */
  .search-wrap{position:relative;margin-bottom:18px}
  .search-input{width:100%;padding:13px 16px 13px 42px;font-size:14.5px;border:1.5px solid var(--border-dk);
    border-radius:10px;background:var(--panel);color:var(--text);outline:none;transition:border-color .15s}
  .search-input:focus{border-color:var(--navy-lt)}
  .search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}

  /* ── Filter chips ── */
  .chips{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .chip{padding:6px 13px;border-radius:16px;font-size:12.5px;font-weight:500;border:1px solid var(--border-dk);
    background:var(--panel);color:var(--text-2);cursor:pointer;transition:all .12s;user-select:none}
  .chip:hover{border-color:var(--navy-lt);color:var(--navy)}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}

  /* ── Fiche grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-bottom:8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 17px;cursor:pointer;
    transition:box-shadow .15s, border-color .15s, transform .1s}
  .card:hover{border-color:var(--navy-lt);box-shadow:0 3px 14px rgba(27,58,92,0.08);transform:translateY(-1px)}
  .card.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(27,58,92,0.12)}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .card-code{font-size:14px;font-weight:700;color:var(--navy-dk);letter-spacing:.2px}
  .sector-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
  .sector-res{background:var(--green-bg);color:var(--green)}
  .sector-ter{background:var(--blue-bg);color:var(--blue)}
  .card-title{font-size:12.5px;color:var(--text-2);margin-bottom:10px;min-height:32px}
  .card-meta{display:flex;gap:6px;flex-wrap:wrap}
  .meta-tag{font-size:10.5px;color:var(--text-3);background:var(--bg);padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
  .no-results{text-align:center;padding:50px 20px;color:var(--text-3);font-size:13.5px}

  /* ── Simulator panel ── */
  .sim-overlay{position:fixed;inset:0;background:rgba(18,40,63,0.35);display:none;align-items:flex-start;
    justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
  .sim-overlay.open{display:flex}
  .sim-panel{background:var(--panel);border-radius:16px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2);
    animation:slideUp .18s ease-out}
  .sim-panel.wide{max-width:860px}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .sim-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .sim-header-l h2{font-size:16px;margin:0 0 2px;color:var(--navy-dk)}
  .sim-header-l p{font-size:12px;color:var(--text-3);margin:0}
  .close-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);color:var(--text-2);
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .12s}
  .close-btn:hover{background:var(--border)}
  .sim-body{padding:22px 24px}
  .cond-box{background:var(--red-bg);border:1px solid #EFC9C6;border-radius:9px;padding:11px 14px;margin-bottom:18px;
    font-size:12px;color:var(--red);line-height:1.55}
  .cond-box b{font-weight:700}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--text-3);font-size:11px}
  .field input, .field select{width:100%;padding:9px 11px;border:1.5px solid var(--border-dk);border-radius:8px;
    font-size:13.5px;background:#FCFDFE;color:var(--text);outline:none;font-family:inherit}
  .field input:focus, .field select:focus{border-color:var(--navy-lt)}
  .divider{height:1px;background:var(--border);margin:18px 0}
  .results{display:flex;flex-direction:column;gap:8px}
  .result-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-radius:9px;
    background:var(--bg);border:1px solid var(--border)}
  .result-row.hi{background:var(--green-bg);border-color:#B9DCC2}
  .result-row.hi .result-val{color:var(--green)}
  .result-row.cdp{background:var(--orange-bg);border-color:#EAD08E}
  .result-row.cdp .result-val{color:var(--orange)}
  .result-row.prec{background:var(--blue-bg);border-color:#B9CDE5}
  .result-row.prec .result-val{color:var(--blue)}
  .result-label{font-size:12.5px;color:var(--text-2);font-weight:500}
  .result-val{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .result-sub{font-size:10.5px;color:var(--text-3);margin-top:1px}
  .source-note{margin-top:16px;font-size:10.5px;color:var(--text-3);line-height:1.5;padding-top:12px;border-top:1px solid var(--border)}

  /* ── Barème tables (style Excel) ── */
  .bareme-toggle{display:flex;align-items:center;gap:7px;width:100%;margin-top:16px;padding:10px 14px;
    border:1.5px dashed var(--border-dk);border-radius:9px;background:none;color:var(--navy);
    font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit}
  .bareme-toggle:hover{border-color:var(--navy-lt);background:var(--bg)}
  .bareme-toggle svg{transition:transform .15s}
  .bareme-toggle.expanded svg{transform:rotate(90deg)}
  .bareme-wrap{margin-top:14px;overflow-x:auto;border:1px solid var(--border);border-radius:10px;display:none}
  .bareme-wrap.open{display:block}
  table.bareme{width:100%;border-collapse:collapse;font-size:11.5px;min-width:560px}
  table.bareme th{background:var(--navy);color:#fff;font-weight:600;padding:8px 9px;text-align:center;
    white-space:nowrap;font-size:10.5px}
  table.bareme th.sub{background:var(--navy-lt);font-size:10px;font-weight:600}
  table.bareme td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  table.bareme .grp-hdr td{background:#EEF2F6;font-weight:700;color:var(--navy-dk);text-align:left;
    font-size:10.5px;padding:6px 9px}
  table.bareme .zone-cell{color:#fff;font-weight:700;font-size:12px}
  table.bareme .z-h1{background:#E8511A}
  table.bareme .z-h2{background:#2E7D32}
  table.bareme .z-h3{background:#1565C0}
  table.bareme tr.alt td:not(.zone-cell){background:#FAFBFC}
  table.bareme td.num-c{color:var(--green);font-weight:700}
  table.bareme td.num-p{color:var(--blue);font-weight:700}
  table.bareme td.num-cdp{color:var(--orange);font-weight:700}
  table.bareme tr.hl td{background:#FFF6DD!important;box-shadow:inset 0 0 0 1.5px #E8C15A}

  /* ── Actions bar (Ajouter au comparatif / Télécharger PDF) ── */
  .sim-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .btn-secondary{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--border-dk);border-radius:9px;
    background:var(--panel);color:var(--navy-dk);font-size:12.5px;font-weight:600;cursor:pointer;
    transition:all .12s;font-family:inherit}
  .btn-secondary:hover{border-color:var(--navy-lt);background:var(--bg)}
  .btn-secondary.added{background:var(--green-bg);border-color:#B9DCC2;color:var(--green)}
  .bareme-actions-row{display:flex;gap:8px;align-items:stretch;margin-top:16px}
  .bareme-actions-row .bareme-toggle{margin-top:0;flex:1}
  .btn-pdf-sm{padding:0 14px;border:1.5px solid var(--border-dk);border-radius:9px;background:var(--panel);
    color:var(--navy-dk);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:all .12s}
  .btn-pdf-sm:hover{border-color:var(--navy-lt);background:var(--bg)}

  /* ── Warning box (seuils minimums) ── */
  .warn-box{background:#FFF3CD;border:1px solid #EAD08E;border-radius:9px;padding:11px 14px;margin-top:12px;
    font-size:12px;color:#7A5510;line-height:1.5;display:none}
  .warn-box.show{display:block}
  .warn-box b{font-weight:700}

  /* ── Cart bar (panier de comparatif) ── */
  .cart-bar{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;
    border-radius:30px;box-shadow:0 8px 24px rgba(18,40,63,0.28);display:none;align-items:center;gap:10px;
    cursor:pointer;font-size:13px;font-weight:600;z-index:90;transition:transform .12s}
  .cart-bar:hover{transform:translateY(-2px)}
  .cart-bar.show{display:flex}
  .cart-badge{background:var(--orange);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:700}

  /* ── Cart panel ── */
  .cart-overlay{position:fixed;inset:0;background:rgba(18,40,63,0.35);display:none;align-items:flex-end;
    justify-content:flex-end;z-index:110;padding:22px}
  .cart-overlay.open{display:flex}
  .cart-panel{background:var(--panel);border-radius:14px;width:380px;max-width:100%;max-height:70vh;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);display:flex;flex-direction:column;overflow:hidden}
  .cart-panel-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;
    align-items:center;justify-content:space-between}
  .cart-panel-header h3{font-size:14.5px;margin:0;color:var(--navy-dk)}
  .cart-list{overflow-y:auto;flex:1;padding:10px 12px}
  .cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    border-radius:8px;background:var(--bg);margin-bottom:7px;font-size:12px}
  .cart-item-info b{display:block;font-size:12.5px;color:var(--navy-dk)}
  .cart-item-info span{color:var(--text-3);font-size:10.5px}
  .cart-item-remove{border:none;background:none;color:var(--red);cursor:pointer;font-size:15px;padding:2px 6px}
  .cart-empty{text-align:center;color:var(--text-3);font-size:12px;padding:30px 10px}
  .cart-panel-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
  .cart-panel-footer button{flex:1;padding:10px;border-radius:9px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:inherit;border:1.5px solid var(--border-dk);background:var(--panel)}
  .cart-panel-footer .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* ── Print area (utilisée uniquement lors de l'impression / export PDF) ── */
  #printArea{display:none}
  .print-doc-header{border-bottom:2px solid #1B3A5C;padding-bottom:10px;margin-bottom:16px}
  .print-doc-header h1{font-size:16px;color:#1B3A5C;margin:0 0 3px}
  .print-doc-header p{font-size:10.5px;color:#5B6B7B;margin:0}
  .print-fiche-title{font-size:14px;font-weight:700;color:#1B3A5C;margin:16px 0 8px}
  .print-table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:11px}
  .print-table td{padding:6px 8px;border-bottom:1px solid #DDE3EA}
  .print-table td.pt-label{color:#5B6B7B;width:55%}
  .print-table td.pt-value{font-weight:600;text-align:right}
  .print-table.results td.pt-value{color:#1E6B3A;font-size:12.5px}
  .print-footer{margin-top:18px;font-size:9.5px;color:#8A97A5;border-top:1px solid #DDE3EA;padding-top:8px}
  .print-page-break{page-break-after:always}
  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:16px}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-mark">CEE</div>
      <div class="brand-text">
        <h1>Simulateur de primes CEE</h1>
        <p>Catalogue complet des fiches &middot; EBS Énergie</p>
      </div>
    </div>
    <div class="stat-pill" id="ficheCount">11 fiches référencées</div>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher une fiche : PAC, isolation, solaire, rénovation, tertiaire..." autocomplete="off">
  </div>

  <div class="chips" id="chips">
    <div class="chip active" data-filter="all">Toutes</div>
    <div class="chip" data-filter="res">Résidentiel</div>
    <div class="chip" data-filter="ter">Tertiaire</div>
    <div class="chip" data-filter="pac">Pompes à chaleur</div>
    <div class="chip" data-filter="isol">Isolation</div>
    <div class="chip" data-filter="solaire">Solaire</div>
    <div class="chip" data-filter="renov">Rénovation globale</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="no-results" id="noResults" style="display:none">Aucune fiche ne correspond à cette recherche.</div>

</div>

<!-- ═══════════ SIMULATOR OVERLAY ═══════════ -->
<div class="sim-overlay" id="overlay">
  <div class="sim-panel">
    <div class="sim-header">
      <div class="sim-header-l">
        <h2 id="simTitle">—</h2>
        <p id="simSubtitle">—</p>
      </div>
      <button class="close-btn" onclick="closeSim()">✕</button>
    </div>
    <div class="sim-body" id="simBody"></div>
  </div>
</div>

<!-- ═══════════ CART FLOATING BAR ═══════════ -->
<div class="cart-bar" id="cartBar" onclick="openCart()">
  🧾 <span id="cartBarText">0 simulation</span>
  <span class="cart-badge" id="cartBadge">0</span>
</div>

<!-- ═══════════ CART PANEL ═══════════ -->
<div class="cart-overlay" id="cartOverlay">
  <div class="cart-panel">
    <div class="cart-panel-header">
      <h3>Comparatif de simulations</h3>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-panel-footer">
      <button onclick="clearCart()">Vider</button>
      <button class="btn-primary" onclick="downloadCartPDF()">📄 Télécharger le PDF</button>
    </div>
  </div>
</div>

<!-- ═══════════ PRINT AREA (invisible à l'écran, utilisée pour l'export PDF) ═══════════ -->
<div id="printArea"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// DONNÉES — CATALOGUE COMPLET DES FICHES CEE
// ═══════════════════════════════════════════════════════════════════════
const FICHES = [
  {
    code:"BAR-TH-171", title:"Pompe à chaleur Air/Eau individuelle", sector:"res", tags:["pac"],
    version:"vA78.4", dv:"17 ans",
    render: renderTH171
  },
  {
    code:"BAR-TH-179", title:"Pompe à chaleur Air/Eau collective", sector:"res", tags:["pac"],
    version:"vA75.1", dv:"22 ans",
    render: renderTH179
  },
  {
    code:"BAT-TH-163", title:"Pompe à chaleur Air/Eau tertiaire", sector:"ter", tags:["pac"],
    version:"vA75.1", dv:"22 ans",
    render: renderBAT163
  },
  {
    code:"BAR-TH-177", title:"Rénovation globale résidentiel collectif", sector:"res", tags:["renov"],
    version:"vA63-1", dv:"30 ans",
    render: renderTH177
  },
  {
    code:"BAR-TH-168", title:"Dispositif solaire thermique", sector:"res", tags:["solaire"],
    version:"vA87.4", dv:"25 ans",
    render: renderTH168
  },
  {
    code:"BAR-EN-101", title:"Isolation combles perdus / rampants", sector:"res", tags:["isol"],
    version:"vA64-6", dv:"30 ans",
    render: r=>renderEN(r,{H1:1700,H2:1400,H3:920},true,"BAR-EN-101")
  },
  {
    code:"BAR-EN-102", title:"Isolation des murs", sector:"res", tags:["isol"],
    version:"vA65-4", dv:"30 ans",
    render: r=>renderEN(r,{H1:1600,H2:1300,H3:880},true,"BAR-EN-102")
  },
  {
    code:"BAR-EN-103", title:"Isolation du plancher bas", sector:"res", tags:["isol"],
    version:"vA64-6", dv:"30 ans",
    render: r=>renderEN(r,{H1:1100,H2:890,H3:590},true,"BAR-EN-103")
  },
  {
    code:"BAT-EN-101", title:"Isolation combles / toitures tertiaire", sector:"ter", tags:["isol"],
    version:"vA64-4", dv:"30 ans",
    render: r=>renderENBat(r,{H1:2600,H2:2100,H3:1400},"BAT-EN-101")
  },
  {
    code:"BAT-EN-102", title:"Isolation des murs tertiaire", sector:"ter", tags:["isol"],
    version:"vA64-3", dv:"30 ans",
    render: renderEN102Bat
  },
  {
    code:"BAT-EN-103", title:"Isolation du plancher bas tertiaire", sector:"ter", tags:["isol"],
    version:"vA64-4", dv:"30 ans",
    render: r=>renderENBat(r,{H1:5200,H2:4200,H3:2800},"BAT-EN-103")
  },
];

const eur = n => n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + " €";
const eur2 = n => n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const kwh = n => n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + " kWhc";
const num = n => n.toLocaleString('fr-FR',{maximumFractionDigits:0});

// ═══════════════════════════════════════════════════════════════════════
// GENERIC BARÈME TABLE TOGGLE — bouton "Voir le barème complet"
// ═══════════════════════════════════════════════════════════════════════
function bareme(container, buildFn){
  container.insertAdjacentHTML('beforeend', `
    <div class="bareme-actions-row">
      <button type="button" class="bareme-toggle" id="baremeToggleBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        <span id="baremeToggleLabel">Voir le barème complet</span>
      </button>
      <button type="button" class="btn-pdf-sm" id="baremeDownloadBtn" title="Télécharger le tableau affiché en PDF">📄 PDF</button>
    </div>
    <div class="bareme-wrap" id="baremeWrap"></div>
  `);
  const btn = container.querySelector('#baremeToggleBtn');
  const wrap = container.querySelector('#baremeWrap');
  const label = container.querySelector('#baremeToggleLabel');
  const dlBtn = container.querySelector('#baremeDownloadBtn');
  btn.addEventListener('click', ()=>{
    const isOpen = wrap.classList.toggle('open');
    btn.classList.toggle('expanded', isOpen);
    label.textContent = isOpen ? 'Masquer le barème complet' : 'Voir le barème complet';
    if(isOpen) buildFn(wrap);
  });
  dlBtn.addEventListener('click', ()=>{
    if(!wrap.classList.contains('open')) buildFn(wrap);
    wrap.classList.add('open');
    btn.classList.add('expanded');
    label.textContent = 'Masquer le barème complet';
    const table = wrap.querySelector('table.bareme');
    if(table) printBaremeTable(currentFiche.code, currentFiche.title, table.outerHTML);
  });
  wrap.refresh = () => { if(wrap.classList.contains('open')) buildFn(wrap); };
  return wrap;
}

// GRID RENDERING
// ═══════════════════════════════════════════════════════════════════════
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const chips = document.querySelectorAll('.chip');
let activeFilter = 'all';

function tagLabel(t){
  return {pac:"PAC",isol:"Isolation",solaire:"Solaire",renov:"Rénovation"}[t] || t;
}

function buildCard(f){
  const div = document.createElement('div');
  div.className = 'card';
  div.onclick = () => openSim(f);
  div.innerHTML = `
    <div class="card-top">
      <span class="card-code">${f.code}</span>
      <span class="sector-tag ${f.sector==='res'?'sector-res':'sector-ter'}">${f.sector==='res'?'Résidentiel':'Tertiaire'}</span>
    </div>
    <div class="card-title">${f.title}</div>
    <div class="card-meta">
      <span class="meta-tag">${f.version}</span>
      <span class="meta-tag">DV ${f.dv}</span>
      ${f.tags.map(t=>`<span class="meta-tag">${tagLabel(t)}</span>`).join('')}
    </div>
  `;
  return div;
}

function renderGrid(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = FICHES.filter(f=>{
    const matchesFilter = activeFilter === 'all' ||
      f.sector === activeFilter ||
      f.tags.includes(activeFilter);
    const matchesSearch = !q ||
      f.code.toLowerCase().includes(q) ||
      f.title.toLowerCase().includes(q) ||
      f.tags.some(t=>tagLabel(t).toLowerCase().includes(q));
    return matchesFilter && matchesSearch;
  });
  grid.innerHTML = '';
  document.getElementById('noResults').style.display = filtered.length ? 'none' : 'block';
  filtered.forEach(f => grid.appendChild(buildCard(f)));
  document.getElementById('ficheCount').textContent = `${filtered.length} / ${FICHES.length} fiches`;
}

searchInput.addEventListener('input', renderGrid);
chips.forEach(c => c.addEventListener('click', () => {
  chips.forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  activeFilter = c.dataset.filter;
  renderGrid();
}));

renderGrid();

function openSim(f){
  currentFiche = f;

// COMPARATIF (PANIER) — capture générique + export PDF via impression
// ═══════════════════════════════════════════════════════════════════════
let currentFiche = null;
let cart = [];

function captureSnapshot(){
  const params = [];
  document.querySelectorAll('#simBody .field').forEach(f=>{
    const label = f.querySelector('label');
    const input = f.querySelector('input,select');
    if(!label || !input) return;
    const labelText = (label.childNodes[0].textContent || '').trim();
    const value = input.tagName === 'SELECT' ? input.options[input.selectedIndex].text : input.value;
    if(labelText) params.push([labelText, value]);
  });
  const results = [];
  document.querySelectorAll('#simBody .result-row').forEach(r=>{
    const label = r.querySelector('.result-label');
    const val = r.querySelector('.result-val');
    if(label && val) results.push([label.textContent.trim(), val.textContent.trim()]);
  });
  return {
    code: currentFiche.code,
    title: currentFiche.title,
    date: new Date().toLocaleString('fr-FR'),
    params, results
  };
}

function updateCartUI(){
  const bar = document.getElementById('cartBar');
  const badge = document.getElementById('cartBadge');
  const text = document.getElementById('cartBarText');
  bar.classList.toggle('show', cart.length > 0);
  badge.textContent = cart.length;
  text.textContent = cart.length + (cart.length>1 ? ' simulations' : ' simulation');
  const list = document.getElementById('cartList');
  if(cart.length === 0){
    list.innerHTML = `<div class="cart-empty">Aucune simulation enregistrée.<br>Ouvrez une fiche et cliquez sur « + Ajouter au comparatif ».</div>`;
    return;
  }
  list.innerHTML = cart.map((s,i)=>`
    <div class="cart-item">
      <div class="cart-item-info"><b>${s.code}</b><span>${s.title} · ${s.date}</span></div>
      <button class="cart-item-remove" onclick="removeFromCart(${i})">✕</button>
    </div>
  `).join('');
}
function removeFromCart(i){ cart.splice(i,1); updateCartUI(); }
function clearCart(){ cart = []; updateCartUI(); }
function openCart(){ document.getElementById('cartOverlay').classList.add('open'); }
function closeCart(){ document.getElementById('cartOverlay').classList.remove('open'); }
function downloadCartPDF(){
  if(cart.length === 0) return;
  printDocument(cart);
}

function snapshotToHTML(s, isLast){
  return `
    <div class="print-doc-header">
      <h1>Simulateur CEE — EBS Énergie</h1>
      <p>Estimation indicative générée le ${s.date}</p>
    </div>
    <div class="print-fiche-title">${s.code} — ${s.title}</div>

function printDocument(snapshots){

function buildBareme171(wrap){
  const pc=parseFloat(document.getElementById('f-pc').value)||0;
  const pp=parseFloat(document.getElementById('f-pp').value)||0;
  const curZone=document.getElementById('f-zone').value;
  const curType=document.getElementById('f-type').value;

  const curBand = curType==='maison'
    ? (curSurf<70?'<70':(curSurf<90?'70-90':'>=90'))
    : (curSurf<35?'<35':(curSurf<60?'35-60':'>=60'));

  const rows = [
    {type:'maison', label:'Maison', bands:[['< 70 m²','<70'],['70–90 m²','70-90'],['≥ 90 m²','>=90']]},

    <th>CdP ×5 Précarité<br>Etas1 / Etas2</th>
  </tr></thead><tbody>`;
  ['H1','H2','H3'].forEach(zone=>{
    rows.forEach(grp=>{
      grp.bands.forEach(([label,bandKey],i)=>{
        const [e1,e2] = REF171[zone][grp.type][bandKey];
        const isCur = zone===curZone && grp.type===curType && bandKey===curBand;
        html += `<tr class="${isCur?'hl':''}">`;
        if(grp.type==='maison' && i===0){
          html += `<td class="zone-cell z-${zone.toLowerCase()}" rowspan="6">${zone}</td>`;
        }
        html += `<td style="text-align:left;font-weight:${i===0?'700':'400'}">${i===0?grp.label:''}</td>`;
        html += `<td>${label}</td>`;
        html += `<td>${num(e1)} / ${num(e2)}</td>`;
        html += `<td class="num-c">${eur(e1/1000*pc)} / ${eur(e2/1000*pc)}</td>`;
        html += `<td class="num-p">${eur(e1/1000*pp)} / ${eur(e2/1000*pp)}</td>`;
        html += `<td class="num-cdp">${eur(e1/1000*pc*5)} / ${eur(e2/1000*pc*5)}</td>`;

  });

}

    </div>

      <div class="field"><label>Prix Précarité <span class="hint">€/MWhc</span></label><input type="number" id="f-pp" value="11" step="0.1"></div>
    </div>
    <div class="divider"></div>
    <div id="condResult"></div>
    <div class="results" id="results" style="margin-top:10px"></div>
    <div class="source-note">Source : BAR-TH-177 vA63-1 · Forfait fixe 2 100 kWhc/m² · CdP charte : 41 €/m² (avec chgt chauffage) / 27 €/m² (sans)</div>
  `);
  function calc(){
    const shab=parseFloat(document.getElementById('f-shab').value)||0;
    const n=parseFloat(document.getElementById('f-n').value)||1;
    const np=parseFloat(document.getElementById('f-np').value)||0;
    const cdp=document.getElementById('f-cdp').value==='oui';
    const ci=parseFloat(document.getElementById('f-ci').value)||0;
    const cp=parseFloat(document.getElementById('f-cp').value)||0;
    const pc=parseFloat(document.getElementById('f-pc').value)||0;
    const pp=parseFloat(document.getElementById('f-pp').value)||0;
    const gain = ci>0 ? (ci-cp)/ci : 0;
    const cond1 = cp<331, cond2 = gain>=0.35;
    document.getElementById('condResult').innerHTML = `
      <div class="result-row" style="background:${cond1?'#E9F4EC':'#FBEAEA'};border-color:${cond1?'#B9DCC2':'#EFC9C6'}">
        <span class="result-label">Cep projet &lt; 331 kWh/m².an</span>
        <span class="result-val" style="font-size:13px;color:${cond1?'#1E6B3A':'#B3261E'}">${cond1?'✓ Conforme':'✗ Non conforme'}</span>
      </div>
      <div class="result-row" style="margin-top:8px;background:${cond2?'#E9F4EC':'#FBEAEA'};border-color:${cond2?'#B9DCC2':'#EFC9C6'}">
        <span class="result-label">Gain énergétique : ${(gain*100).toFixed(1)}%</span>

      </div>
    `;
    const kwhc = 2100*shab;
    const primeMix = (kwhc/1000*pp*np/n) + (kwhc/1000*pc*(n-np)/n);
    const cdpMin = cdp ? shab*41 : shab*27;
    document.getElementById('results').innerHTML = `
      <div class="result-row hi"><span class="result-label">Prime CEE (mix précarité/classique)</span><span class="result-val">${eur(primeMix)}</span></div>
      <div class="result-row cdp"><span class="result-label">Minimum Coup de Pouce charte</span><span class="result-val">${eur(cdpMin)}</span></div>
    `;
  }
  body.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',calc));
  calc();
}

  `);

  wrap.innerHTML = html;
}
</script>
